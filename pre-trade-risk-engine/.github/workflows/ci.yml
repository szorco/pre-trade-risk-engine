name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -------------------------------------------------------------------------
  # C++ build
  # -------------------------------------------------------------------------
  build-cpp:
    name: Build C++ Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++-13

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # TODO: add a step that runs the binary with a --selftest flag
      #       once you implement a built-in smoke test mode

  # -------------------------------------------------------------------------
  # Python integration tests
  # -------------------------------------------------------------------------
  test-python:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest api/tests/ -v \
            --cov=api \
            --cov-report=term-missing \
            --cov-fail-under=90

      # TODO: upload coverage report to Codecov once repo is public
      # - uses: codecov/codecov-action@v4
